name: Gerar APK Android (PULSE)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar código do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Configurar Java JDK 21 (necessário para o Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Instalar dependências e compilar o PULSE (dist)
        run: |
          npm install
          npm run build

      - name: 5. Empacotar projeto Android com Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 6. Compilar arquivo APK (app-debug.apk)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 7. Disponibilizar APK para download na aba Actions
        uses: actions/upload-artifact@v4
        with:
          name: PULSE-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
